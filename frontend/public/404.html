<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | TEDxNERIST</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="googlebot" content="noindex,nofollow">
    <meta name="theme-color" content="#050505">
    <style media="screen">
      @font-face {
        font-family: "Gilroy-Regular";
        src: url("/fonts/Gilroy-Regular.ttf") format("truetype");
      }

      @font-face {
        font-family: "Cirka";
        src: url("/fonts/PPCirka-Variable.ttf") format("truetype");
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #050505;
        color: #f0f0f0;
        font-family: "Gilroy-Regular", Arial, sans-serif;
      }

      .card {
        width: min(640px, 100%);
        padding: 40px 32px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(17, 17, 17, 0.98), rgba(8, 8, 8, 0.96));
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      .brand {
        margin-bottom: 18px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .brand span {
        color: #eb0028;
      }

      h1 {
        margin: 0 0 12px;
        font-family: "Cirka", Georgia, serif;
        font-size: clamp(40px, 8vw, 72px);
        line-height: 1;
        color: #eb0028;
      }

      h2 {
        margin: 0 0 16px;
        font-family: "Cirka", Georgia, serif;
        font-size: clamp(24px, 4vw, 40px);
      }

      p {
        margin: 0 auto;
        max-width: 42ch;
        line-height: 1.75;
        color: #d1d5db;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      .button-primary {
        background: #eb0028;
        color: #fff;
      }

      .button-secondary {
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">TED<span>x</span>NERIST</div>
      <h1>404</h1>
      <h2>This idea has not spread yet</h2>
      <p>The page you are looking for is missing or no longer available. Head back to the TEDxNERIST homepage or explore the latest event details from there.</p>
      <div class="actions">
        <a class="button button-primary" href="/">Return Home</a>
        <a class="button button-secondary" href="/contact">Contact Us</a>
      </div>
    </div>
  </body>
</html>
